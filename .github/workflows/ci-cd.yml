name: SinkoAdmin CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sinko-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Admin Panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinko-admin-dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sinko-admin-dist
          path: dist

      - name: Check Azure Deployment Secrets
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZURE_PUBLISH_PROFILE" ]; then
            echo "Deploying to Azure WebApp with publish profile..."
          elif [ -n "$AZURE_CREDENTIALS" ]; then
            echo "Deploying to Azure WebApp with credentials..."
          else
            echo "Notice: Azure credentials secret (AZURE_WEBAPP_PUBLISH_PROFILE or AZURE_CREDENTIALS) not set."
            echo "Artifact built and ready. Deploy can be triggered manually or via deploy.bat."
          fi
